databaseChangeLog:
  - changeSet:
      id: create_files_table
      author: vladobrod
      changes:
        - createTable:
            schemaName: tournament
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: uploader_id
                  type: BIGINT

              - column:
                  name: path
                  type: VARCHAR(1024)

              - column:
                  name: file_name
                  type: VARCHAR(255)

              - column:
                  name: file_real_name
                  type: VARCHAR(255)

              - column:
                  name: file_size
                  type: VARCHAR(50)

              - column:
                  name: file_type
                  type: VARCHAR(100)

              - column:
                  name: upload_date
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: files
            baseColumnNames: uploader_id
            referencedTableSchemaName: tournament
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_files_uploader


  - changeSet:
      id: create_certificate_templates
      author: vladobrod
      changes:
        - createTable:
            schemaName: tournament
            tableName: certificate_templates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: uploader_id
                  type: BIGINT

              - column:
                  name: file_id
                  type: BIGINT

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificate_templates
            baseColumnNames: uploader_id
            referencedTableSchemaName: tournament
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_templates_uploader

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificate_templates
            baseColumnNames: file_id
            referencedTableSchemaName: tournament
            referencedTableName: files
            referencedColumnNames: id
            constraintName: fk_templates_file


  - changeSet:
      id: create_certificates
      author: vladobrod
      changes:
        - createTable:
            schemaName: tournament
            tableName: certificates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: receiver_id
                  type: BIGINT

              - column:
                  name: creator_id
                  type: BIGINT

              - column:
                  name: file_id
                  type: BIGINT

              - column:
                  name: certificate_template_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: status
                  type: VARCHAR(50)

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificates
            baseColumnNames: receiver_id
            referencedTableSchemaName: tournament
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cert_receiver

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificates
            baseColumnNames: creator_id
            referencedTableSchemaName: tournament
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cert_creator

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificates
            baseColumnNames: file_id
            referencedTableSchemaName: tournament
            referencedTableName: files
            referencedColumnNames: id
            constraintName: fk_cert_file

        - addForeignKeyConstraint:
            baseTableSchemaName: tournament
            baseTableName: certificates
            baseColumnNames: certificate_template_id
            referencedTableSchemaName: tournament
            referencedTableName: certificate_templates
            referencedColumnNames: id
            constraintName: fk_cert_template